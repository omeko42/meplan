<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Obsidian Squircle Background -->
    <linearGradient id="bg-squircle" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E2433" />
      <stop offset="55%" stop-color="#10141E" />
      <stop offset="100%" stop-color="#080A0F" />
    </linearGradient>

    <linearGradient id="top-gloss" x1="60" y1="4" x2="60" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="border-gold" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF3B8" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#8A6412" stop-opacity="0.75" />
    </linearGradient>

    <!-- 3D Champagne Gold Ribbon Gradients -->
    <linearGradient id="gold-main" x1="20" y1="22" x2="96" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF7D6" />
      <stop offset="32%" stop-color="#E6C35C" />
      <stop offset="68%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8A6412" />
    </linearGradient>

    <linearGradient id="gold-pillar" x1="24" y1="96" x2="88" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8A6412" />
      <stop offset="48%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#FFF2B2" />
    </linearGradient>

    <linearGradient id="gold-shadow" x1="30" y1="28" x2="65" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7A560E" />
      <stop offset="100%" stop-color="#B88E22" />
    </linearGradient>

    <filter id="ribbon-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#bg-squircle)" />
  <path d="M32 5H88C102.9 5 115 17.1 115 32V52C98 60 79 64 60 64C41 64 22 60 5 52V32C5 17.1 17.1 5 32 5Z" fill="url(#top-gloss)" />
  <rect x="5" y="5" width="110" height="110" rx="27" stroke="url(#border-gold)" stroke-width="2" />

  <!-- 3D Champagne Gold Ribbon "M" + Star Sparkle -->
  <g filter="url(#ribbon-shadow)">
    <rect x="22" y="28" width="17" height="64" rx="4" fill="url(#gold-pillar)" />
    <rect x="74" y="28" width="16" height="58" rx="4" fill="url(#gold-shadow)" />
    <path d="M22 28H37L59 74H45L22 28Z" fill="url(#gold-main)" />
    <path d="M45 74L69 28H86L59 74H45Z" fill="url(#gold-pillar)" />
    <path d="M84 48C84 65 88.5 69.5 105 69.5C88.5 69.5 84 74 84 91C84 74 79.5 69.5 63 69.5C79.5 69.5 84 65 84 48Z" fill="url(#gold-main)" />
  </g>
</svg>
