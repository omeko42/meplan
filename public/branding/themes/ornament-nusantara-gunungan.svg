    <path d="M376 52C362 52 348 38 348 24" />
    <circle cx="366" cy="34" r="4" fill="url(#wayangGold)"/>
    <!-- Bottom Left -->
    <path d="M24 452C24 478.5 45.5 500 72 500" />
    <path d="M24 468C38 468 52 482 52 496" />
    <circle cx="34" cy="486" r="4" fill="url(#wayangGold)"/>
    <!-- Bottom Right -->
    <path d="M376 452C376 478.5 354.5 500 328 500" />
    <path d="M376 468C362 468 348 482 348 496" />
    <circle cx="366" cy="486" r="4" fill="url(#wayangGold)"/>
  </g>

