    stroke="url(#wayangGold)"
    stroke-width="1"
    stroke-dasharray="3 3"
    opacity="0.75"
  />

  <!-- Tree of Life (Kalpataru) Filigree Inside Gunungan -->
  <g stroke="url(#wayangGold)" stroke-width="1.3" stroke-linecap="round" opacity="0.65">
    <path d="M200 90V375"/>
    <path d="M200 160C175 145 155 160 155 182C155 202 178 212 200 198"/>
    <path d="M200 160C225 145 245 160 245 182C245 202 222 212 200 198"/>
    <path d="M200 230C165 212 140 232 142 260C144 285 172 294 200 276"/>
    <path d="M200 230C235 212 260 232 258 260C256 285 228 294 200 276"/>
    <path d="M168 355H232"/>
    <path d="M152 372H248"/>
  </g>

  <!-- Crown Jewel Apex -->
  <path d="M200 26L207 40L200 50L193 40L200 26Z" fill="url(#wayangGold)"/>
  <circle cx="200" cy="195" r="36" fill="#170C07" stroke="url(#wayangGold)" stroke-width="2"/>
  <text x="200" y="201" text-anchor="middle" fill="url(#wayangGold)" font-family="Georgia, serif" font-size="18" font-weight="bold" letter-spacing="2">R&amp;D</text>

