  <rect x="10" y="10" width="380" height="500" rx="22" stroke="url(#wayangGold)" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="16" y="16" width="368" height="488" rx="18" stroke="url(#wayangGold)" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.45"/>

