  <rect x="86" y="432" width="228" height="36" rx="18" fill="url(#wayangGold)"/>
  <text x="200" y="454" text-anchor="middle" fill="#1B0E08" font-family="Georgia, serif" font-size="11" font-weight="bold" letter-spacing="2.5">PAWIWAHAN AGENG</text>
