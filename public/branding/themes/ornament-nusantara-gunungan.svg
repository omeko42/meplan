<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" fill="none">
  <defs>
    <linearGradient id="wayangGold" x1="0" y1="0" x2="400" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF0CA"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#B68D40"/>
      <stop offset="100%" stop-color="#7A5918"/>
    </linearGradient>
    <linearGradient id="kratonBg" x1="200" y1="0" x2="200" y2="520" gradientUnits="userSpaceOnUse">
