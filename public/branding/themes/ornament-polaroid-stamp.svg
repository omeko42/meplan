<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" fill="none">
  <defs>
    <linearGradient id="paperBg" x1="0" y1="0" x2="400" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F4ECE1"/>
    </linearGradient>
    <filter id="polaroidShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2A1E17" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Editorial Magazine Background -->
  <rect width="400" height="520" rx="28" fill="url(#paperBg)"/>

  <!-- Top Editorial Masthead Typography -->
  <text x="32" y="54" fill="#1C1917" font-family="Georgia, serif" font-size="28" font-weight="bold" letter-spacing="-0.5">PHOTOVIT</text>
  <text x="218" y="52" fill="#C86D51" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="2.5">VOL. 26 • THE WEDDING ISSUE</text>
  <line x1="32" y1="68" x2="368" y2="68" stroke="#1C1917" stroke-width="1.5"/>
  <line x1="32" y1="72" x2="368" y2="72" stroke="#1C1917" stroke-width="0.5"/>

  <!-- Tilted Instant Polaroid Frame -->
  <g transform="rotate(-3.5 200 250)" filter="url(#polaroidShadow)">
    <rect x="76" y="106" width="248" height="296" rx="6" fill="#FFFFFF" stroke="#E7E0D6" stroke-width="1"/>
    <rect x="92" y="122" width="216" height="216" fill="#E6D7C9"/>
    <!-- Minimalist Sun & Arch Illustration inside Polaroid -->
    <circle cx="250" cy="172" r="24" fill="#C86D51" fill-opacity="0.85"/>
    <path d="M126 338C126 278 160 242 200 242C240 242 274 278 274 338H126Z" fill="#8C4A32"/>
    <text x="200" y="370" text-anchor="middle" fill="#292524" font-family="Georgia, serif" font-style="italic" font-size="16">Rayhan &amp; Clarissa — '26</text>
  </g>

  <!-- Masking Tape Top Accent -->
  <rect x="162" y="92" width="76" height="22" transform="rotate(4 200 103)" fill="#E8D8C3" fill-opacity="0.82"/>

  <!-- Vintage Postmark Stamp (Bottom Right) -->
  <g transform="rotate(-12 310 385)">
    <circle cx="310" cy="385" r="36" fill="none" stroke="#C86D51" stroke-width="1.8" stroke-dasharray="3 2"/>
    <circle cx="310" cy="385" r="29" fill="none" stroke="#C86D51" stroke-width="1"/>
    <text x="310" y="382" text-anchor="middle" fill="#C86D51" font-family="monospace" font-size="8" font-weight="bold" letter-spacing="1.5">OCTOBER 24</text>
    <text x="310" y="394" text-anchor="middle" fill="#C86D51" font-family="monospace" font-size="9" font-weight="bold">JAKARTA • 2026</text>
  </g>

  <!-- Editorial Barcode & Issue Footer -->
  <line x1="32" y1="452" x2="368" y2="452" stroke="#1C1917" stroke-width="1"/>
  <text x="32" y="476" fill="#1C1917" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="2">EXCLUSIVE GUEST EDITION</text>
  <rect x="292" y="462" width="76" height="24" rx="12" fill="#C86D51"/>
  <text x="330" y="478" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="1">OPEN ISSUE</text>
</svg>
