      <stop offset="0%" stop-color="#6E9678"/>
      <stop offset="100%" stop-color="#3D5D46"/>
    </linearGradient>
    <linearGradient id="goldStem" x1="0" y1="0" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4AF37"/>
