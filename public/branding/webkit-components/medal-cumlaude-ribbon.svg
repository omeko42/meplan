      <stop offset="0%" stop-color="#FAF0CA"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>
  <!-- Bottom Flowing Ribbons -->
