      <stop offset="55%" stop-color="#9F1239"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </radialGradient>
    <linearGradient id="waxGold" x1="30" y1="30" x2="130" y2="130" gradientUnits="userSpaceOnUse">
