<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="gold-cal" x1="8" y1="10" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A6F1A" />
    </linearGradient>
    <style>
      .clock-hand { transform-origin: 46px 46px; animation: tickClock 6s linear infinite; }
      .cal-star { transform-origin: 28px 37px; animation: pulseStar 2.2s ease-in-out infinite; }
      @keyframes tickClock {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseStar {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.18); }
      }
    </style>
  </defs>
  <!-- Calendar Body -->
  <rect x="10" y="14" width="40" height="38" rx="7" fill="#D4AF37" fill-opacity="0.1" stroke="url(#gold-cal)" stroke-width="2.4" />
  <!-- Calendar Header Bar -->
  <path d="M10 21 C10 17.1 13.1 14 17 14 H43 C46.9 14 50 17.1 50 21 V25 H10 V21 Z" fill="url(#gold-cal)" />
  <!-- Binding Rings -->
  <rect x="19" y="9" width="4" height="9" rx="2" fill="#FEF3C7" stroke="#9A6F1A" stroke-width="1" />
  <rect x="37" y="9" width="4" height="9" rx="2" fill="#FEF3C7" stroke="#9A6F1A" stroke-width="1" />
  <!-- Highlighted Event Date Heart/Star in Center -->
  <g class="cal-star">
    <path d="M28 43 C28 43 20 37.5 20 33 C20 30.2 22.2 28.5 24.6 28.5 C26.2 28.5 27.3 29.4 28 30.6 C28.7 29.4 29.8 28.5 31.4 28.5 C33.8 28.5 36 30.2 36 33 C36 37.5 28 43 28 43 Z" fill="#F43F5E" />
  </g>
  <!-- Sub-Badge Clock in Bottom Right -->
  <circle cx="46" cy="46" r="11" fill="#0F172A" stroke="url(#gold-cal)" stroke-width="2.4" />
  <line x1="46" y1="46" x2="46" y2="40" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" />
  <g class="clock-hand">
    <line x1="46" y1="46" x2="51" y2="46" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  </g>
  <circle cx="46" cy="46" r="1.8" fill="#FDE68A" />
</svg>