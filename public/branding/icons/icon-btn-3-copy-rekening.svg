<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="copy-gold" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A6F1A" />
    </linearGradient>
    <style>
      .check-draw { transform-origin: 36px 38px; animation: pulseCheck 2.4s ease-in-out infinite; }
      @keyframes pulseCheck {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.15); }
      }
    </style>
  </defs>
  <!-- Back Document Sheet -->
  <rect x="12" y="10" width="28" height="36" rx="4" fill="#D4AF37" fill-opacity="0.15" stroke="url(#copy-gold)" stroke-width="2" />
  <!-- Front Clipboard Card -->
  <rect x="22" y="18" width="30" height="38" rx="5" fill="#0F172A" stroke="url(#copy-gold)" stroke-width="2.4" />
  <!-- Top Clip -->
  <rect x="30" y="14" width="14" height="7" rx="3" fill="url(#copy-gold)" />
  <!-- Glowing Checkmark Circle -->
  <g class="check-draw">
    <circle cx="37" cy="38" r="10" fill="#10B981" fill-opacity="0.2" stroke="#34D399" stroke-width="2" />
    <path d="M32 38 L35.5 41.5 L42.5 34.5" stroke="#6EE7B7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>