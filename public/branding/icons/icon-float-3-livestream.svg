<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="live-gold" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A6F1A" />
    </linearGradient>
    <style>
      .wave-pulse { transform-origin: 32px 24px; animation: pulseWave 1.8s ease-out infinite; }
      .live-dot { animation: blinkDot 1.2s ease-in-out infinite; }
      @keyframes pulseWave {
        0% { transform: scale(0.85); opacity: 1; }
        100% { transform: scale(1.18); opacity: 0.15; }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
    </style>
  </defs>
  <!-- Signal Waves -->
  <g class="wave-pulse">
    <path d="M18 14 C12 20 12 30 18 36 M46 14 C52 20 52 30 46 36" stroke="url(#live-gold)" stroke-width="2.4" stroke-linecap="round" />
    <path d="M23 18 C19 22 19 28 23 32 M41 18 C45 22 45 28 41 32" stroke="#FDE68A" stroke-width="2.2" stroke-linecap="round" />
  </g>
  <!-- Center Antenna / Play Circle -->
  <circle cx="32" cy="25" r="5" fill="#F43F5E" class="live-dot" />
  <line x1="32" y1="30" x2="32" y2="40" stroke="url(#live-gold)" stroke-width="2.8" stroke-linecap="round" />
  <!-- LIVE Pill Badge -->
  <rect x="14" y="40" width="36" height="15" rx="5" fill="#0F172A" stroke="url(#live-gold)" stroke-width="2" />
  <circle cx="21" cy="47.5" r="2.5" fill="#F43F5E" class="live-dot" />
  <text x="36" y="51" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="800" letter-spacing="1.2" fill="#FDE68A">LIVE</text>
</svg>