<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cam-gold" x1="8" y1="14" x2="56" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A6F1A" />
    </linearGradient>
    <style>
      .lens-shimmer { transform-origin: 32px 36px; animation: lensPulse 3s ease-in-out infinite; }
      .flash-burst { transform-origin: 48px 16px; animation: flashBlink 3s ease-in-out infinite; }
      @keyframes lensPulse {
        0%, 100% { transform: scale(1) rotate(0deg); }
        50% { transform: scale(1.06) rotate(12deg); }
      }
      @keyframes flashBlink {
        0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
        40% { transform: scale(1.25); opacity: 1; }
      }
    </style>
  </defs>
  <!-- Back Tilted Polaroid Card -->
  <rect x="14" y="10" width="38" height="34" rx="4" transform="rotate(-7 14 10)" fill="#D4AF37" fill-opacity="0.14" stroke="#D4AF37" stroke-width="1.4" />
  <!-- Camera Body -->
  <path d="M10 25 C10 21.7 12.7 19 16 19 H21 L24.5 14 H39.5 L43 19 H48 C51.3 19 54 21.7 54 25 V47 C54 50.3 51.3 53 48 53 H16 C12.7 53 10 50.3 10 47 V25 Z" fill="#0F172A" fill-opacity="0.75" stroke="url(#cam-gold)" stroke-width="2.4" />
  <!-- Camera Lens -->
  <g class="lens-shimmer">
    <circle cx="32" cy="36" r="11" fill="url(#cam-gold)" />
    <circle cx="32" cy="36" r="7.5" fill="#0F172A" />
    <circle cx="29.5" cy="33.5" r="2.5" fill="#E0F2FE" fill-opacity="0.85" />
    <circle cx="34.5" cy="38.5" r="1.2" fill="#FDA4AF" />
  </g>
  <!-- Flash Sparkle -->
  <g class="flash-burst">
    <path d="M48 8 C48 13 50 15 55 15 C50 15 48 17 48 22 C48 17 46 15 41 15 C46 15 48 13 48 8 Z" fill="#FEF08A" />
  </g>
</svg>