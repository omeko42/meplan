<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="tix-gold" x1="8" y1="14" x2="56" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A6F1A" />
    </linearGradient>
    <style>
      .ticket-float { transform-origin: 32px 32px; animation: floatTicket 3s ease-in-out infinite; }
      @keyframes floatTicket {
        0%, 100% { transform: translateY(0) rotate(-3deg); }
        50% { transform: translateY(-3px) rotate(2deg); }
      }
    </style>
  </defs>
  <g class="ticket-float">
    <!-- Perforated VIP Ticket Shape -->
    <path d="M8 20 C8 17.8 9.8 16 12 16 H52 C54.2 16 56 17.8 56 20 V26 C52.5 26 50 28.7 50 32 C50 35.3 52.5 38 56 38 V44 C56 46.2 54.2 48 52 48 H12 C9.8 48 8 46.2 8 44 V38 C11.5 38 14 35.3 14 32 C14 28.7 11.5 26 8 26 V20 Z" fill="#1E293B" stroke="url(#tix-gold)" stroke-width="2.4" />
    <!-- Stub Divider -->
    <line x1="40" y1="18" x2="40" y2="46" stroke="#D4AF37" stroke-width="1.8" stroke-dasharray="3 3" />
    <!-- RSVP Checkmark Badge -->
    <circle cx="25" cy="32" r="8.5" fill="url(#tix-gold)" />
    <path d="M21.5 32 L24 34.5 L29 29.5" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>