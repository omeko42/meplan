<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pin-gold" x1="16" y1="8" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A6F1A" />
    </linearGradient>
    <style>
      .pin-bounce { transform-origin: 32px 48px; animation: bouncePin 2.2s ease-in-out infinite; }
      .radar-ring { transform-origin: 32px 52px; animation: pulseRadar 2.2s ease-out infinite; }
      @keyframes bouncePin {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes pulseRadar {
        0% { transform: scale(0.7); opacity: 0.9; }
        100% { transform: scale(1.35); opacity: 0; }
      }
    </style>
  </defs>
  <!-- Ground Radar Ripple -->
  <ellipse cx="32" cy="52" rx="16" ry="5.5" stroke="#D4AF37" stroke-width="2" class="radar-ring" />
  <ellipse cx="32" cy="52" rx="11" ry="3.8" fill="#D4AF37" fill-opacity="0.25" stroke="url(#pin-gold)" stroke-width="1.5" />
  <!-- Bouncing 3D Location Pin -->
  <g class="pin-bounce">
    <path d="M32 8 C21.5 8 13 16.5 13 27 C13 39.5 32 51 32 51 C32 51 51 39.5 51 27 C51 16.5 42.5 8 32 8 Z" fill="url(#pin-gold)" stroke="#FFFBEB" stroke-width="1.5" />
    <circle cx="32" cy="26" r="9.5" fill="#0F172A" stroke="#FDE68A" stroke-width="1.5" />
    <!-- Heart inside Pin -->
    <path d="M32 31 C32 31 27 27.5 27 24.5 C27 22.8 28.3 21.5 30 21.5 C31 21.5 31.6 22 32 22.8 C32.4 22 33 21.5 34 21.5 C35.7 21.5 37 22.8 37 24.5 C37 27.5 32 31 32 31 Z" fill="#FB7185" />
  </g>
</svg>