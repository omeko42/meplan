<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="box-gold" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A6F1A" />
    </linearGradient>
    <style>
      .parcel-float { transform-origin: 32px 32px; animation: floatParcel 2.8s ease-in-out infinite; }
      @keyframes floatParcel {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
    </style>
  </defs>
  <g class="parcel-float">
    <!-- Isometric Parcel Cube -->
    <polygon points="32,10 54,21 32,32 10,21" fill="#D4AF37" fill-opacity="0.35" stroke="url(#box-gold)" stroke-width="2.2" stroke-linejoin="round" />
    <polygon points="10,21 32,32 32,54 10,43" fill="#1E293B" stroke="url(#box-gold)" stroke-width="2.2" stroke-linejoin="round" />
    <polygon points="54,21 32,32 32,54 54,43" fill="#0F172A" stroke="url(#box-gold)" stroke-width="2.2" stroke-linejoin="round" />
    <!-- Parcel Packing Tape & Heart Tag -->
    <line x1="21" y1="15.5" x2="43" y2="26.5" stroke="#FDE68A" stroke-width="3" />
    <path d="M43 26.5 V36 L39 34 V24.5" fill="#FB7185" />
  </g>
</svg>