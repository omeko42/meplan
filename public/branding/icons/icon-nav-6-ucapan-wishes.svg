<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="wish-gold" x1="8" y1="10" x2="56" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A6F1A" />
    </linearGradient>
    <style>
      .quill-write { transform-origin: 40px 38px; animation: writeMotion 2.8s ease-in-out infinite; }
      .bubble-heart { transform-origin: 24px 25px; animation: floatBubble 2.8s ease-in-out infinite; }
      @keyframes writeMotion {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(2px, -3px) rotate(6deg); }
      }
      @keyframes floatBubble {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2.5px); }
      }
    </style>
  </defs>
  <!-- Chat / Wish Card Bubble -->
  <g class="bubble-heart">
    <path d="M10 20 C10 14.5 14.5 10 20 10 H38 C43.5 10 48 14.5 48 20 V34 C48 39.5 43.5 44 38 44 H24 L14 52 V44 C11.5 43 10 39.5 10 34 V20 Z" fill="#D4AF37" fill-opacity="0.12" stroke="url(#wish-gold)" stroke-width="2.3" stroke-linejoin="round" />
    <!-- Mini Love Heart & Lines Inside Chat -->
    <path d="M23 26 C23 26 17.5 22 17.5 19 C17.5 17.2 19 16 20.5 16 C21.6 16 22.4 16.6 23 17.5 C23.6 16.6 24.4 16 25.5 16 C27 16 28.5 17.2 28.5 19 C28.5 22 23 26 23 26 Z" fill="#FB7185" />
    <line x1="18" y1="32" x2="36" y2="32" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" />
    <line x1="18" y1="37" x2="30" y2="37" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" />
  </g>
  <!-- Golden Feather Quill Pen -->
  <g class="quill-write">
    <path d="M55 12 C46 13 39 20 36 31 L33 44 L45 41 C52 37 56 26 55 12 Z" fill="url(#wish-gold)" stroke="#FFFBEB" stroke-width="1.2" />
    <path d="M54 13 L31 46" stroke="#FEF3C7" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>